<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forge.ops</title>
    <script>
      ;(function () {
        try {
          var root = document.documentElement
          var storage = window.localStorage
          var theme = storage.getItem('forge.theme') || 'dracula'
          var choice = storage.getItem('forge.mode') || 'system'
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var mode = choice === 'system' ? (dark ? 'dark' : 'light') : choice
          root.dataset.mode = mode
          root.style.colorScheme = mode
          var cache = JSON.parse(storage.getItem('forge.palette') || 'null')
          if (cache && cache.signature === theme + '|' + mode) {
            for (var name in cache.variables) {
              root.style.setProperty(name, cache.variables[name])
            }
            root.dataset.theme = theme
          }
        } catch (error) {
          return
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..125,400..900;1,75..125,400..900&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
