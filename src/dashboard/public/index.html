<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starfleet — Dashboard</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img class="logo" src="/favicon.svg" alt="" width="32" height="32" />
        <h1 id="app-title">Starfleet</h1>
      </div>
      <div class="settings">
        <button id="settings-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Reglages">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <div id="settings-panel" role="menu" hidden>
          <label class="setting">
            <span data-i18n="settings.language"></span>
            <select id="locale-select">
              <option value="fr">Français (France)</option>
              <option value="en">English (United States)</option>
              <option value="es">Español (España)</option>
              <option value="pt">Português (Portugal)</option>
              <option value="zh">中文（中国）</option>
              <option value="ja">日本語（日本）</option>
              <option value="ko">한국어 (대한민국)</option>
              <option value="ar">العربية (مصر)</option>
            </select>
          </label>
          <div class="setting">
            <span id="font-size-label" data-i18n="settings.fontSize"></span>
            <div class="slider-row">
              <span class="slider-cap" aria-hidden="true">A</span>
              <input
                id="font-size-slider"
                type="range"
                min="0.85"
                max="1.35"
                step="0.05"
                value="1"
                aria-labelledby="font-size-label"
              />
              <span class="slider-cap slider-cap-lg" aria-hidden="true">A</span>
            </div>
          </div>
          <div class="setting">
            <span data-i18n="settings.theme"></span>
            <div class="segmented" id="theme-group" role="group">
              <button type="button" data-theme-choice="auto" data-i18n="settings.auto"></button>
              <button type="button" data-theme-choice="light" data-i18n="settings.light"></button>
              <button type="button" data-theme-choice="dark" data-i18n="settings.dark"></button>
            </div>
          </div>
        </div>
      </div>
      <div class="refresh-row">
        <button id="refresh-btn" type="button" aria-label="Actualiser">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M23 4v6h-6"></path>
            <path d="M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
        <p id="last-refresh"></p>
      </div>
    </header>
    <section id="stats" class="stats" aria-live="polite"></section>
    <div class="filters">
      <details class="create">
        <summary data-i18n="form.new"></summary>
        <form id="create-form">
          <input name="project" required />
          <input name="branch" required />
          <input name="repoPath" />
          <input name="runCommand" />
          <input name="feature" />
          <select name="role">
            <option value="" data-i18n="form.role"></option>
            <option value="front">front</option>
            <option value="back">back</option>
            <option value="service">service</option>
            <option value="other">other</option>
          </select>
          <button type="submit" data-i18n="form.create"></button>
        </form>
      </details>
      <input id="search" type="search" />
      <select id="project-filter"></select>
      <select id="status-filter">
        <option value="" data-i18n="filter.allStatuses"></option>
        <option value="created">created</option>
        <option value="in_progress">in_progress</option>
        <option value="done">done</option>
        <option value="escalated">escalated</option>
        <option value="awaiting_human">awaiting_human</option>
      </select>
    </div>
    <main>
      <div id="tasks-body" class="cards"></div>
      <p id="empty-state" hidden></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
