<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Starfleet — Dashboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1 id="app-title">Starfleet</h1>
      <select id="locale-select" aria-label="Language">
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="pt">Português</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="ar">العربية</option>
      </select>
      <p id="last-refresh"></p>
    </header>
    <main>
      <table id="tasks-table">
        <thead>
          <tr>
            <th data-i18n="columns.branch"></th>
            <th data-i18n="columns.port"></th>
            <th data-i18n="columns.status"></th>
            <th data-i18n="columns.checkpoint"></th>
          </tr>
        </thead>
        <tbody id="tasks-body"></tbody>
      </table>
      <p id="empty-state" hidden></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
