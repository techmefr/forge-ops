name: desktop-check

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "frontend/src/technical/Api/**"
      - ".github/workflows/desktop-check.yml"

jobs:
  cargo-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npx tauri icon src-tauri/app-icon.svg
      - run: npm run -s build:web
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
