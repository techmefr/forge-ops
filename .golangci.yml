version: "2"

linters:
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errcheck
    - govet
    - ineffassign
    - noctx
    - staticcheck
    - unused

  settings:
    depguard:
      rules:
        technical-never-imports-functional:
          files:
            - "**/internal/technical/**"
          deny:
            - pkg: github.com/techmefr/starfleet/internal/functional
              desc: "technical/ never imports functional/. If a value is missing, the caller passes it as a parameter."

    govet:
      disable:
        - shadow

    errcheck:
      check-type-assertions: true
