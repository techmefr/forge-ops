name: forge-vps

services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    environment:
      FORGE_MODE: hub
      FORGE_TOKEN_FILE: /run/secrets/board_token
    secrets:
      - board_token
    volumes:
      - server-data:/data

  instance:
    build:
      context: ..
      dockerfile: docker/instance.Dockerfile
    environment:
      FORGE_MODE: hub
      FORGE_SERVER_URL: http://server:4311
      FORGE_TOKEN_FILE: /run/secrets/board_token
      FORGE_INSTANCE_TOKEN_FILE: /run/secrets/instance_token
    secrets:
      - board_token
      - instance_token
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - instance-data:/data
      - ${FORGE_REPOSITORIES:-./repositories}:/repositories

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    environment:
      FORGE_INSTANCE_URL: ${FORGE_PUBLIC_INSTANCE_URL:?the address browsers reach the instance at}
      FORGE_SERVER_URL: ${FORGE_PUBLIC_SERVER_URL:-}
    depends_on:
      instance:
        condition: service_healthy
    ports:
      - '4310:80'

secrets:
  board_token:
    file: ./board_token.secret
  instance_token:
    file: ./instance_token.secret

volumes:
  server-data:
  instance-data:
