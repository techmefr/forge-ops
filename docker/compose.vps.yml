name: forge-vps

services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    environment:
      FORGE_MODE: hub
      FORGE_TOKEN_PATH: /run/secrets/board_token
      FORGE_SUPER_ADMIN_LOGIN: ${FORGE_SUPER_ADMIN_LOGIN:-}
      FORGE_SUPER_ADMIN_PASSWORD_FILE: /run/secrets/super_admin_password
      FORGE_PUBLIC_ORIGIN: ${FORGE_PUBLIC_INSTANCE_URL:-}
      FORGE_OIDC_ALLOWED_DOMAINS: ${FORGE_OIDC_ALLOWED_DOMAINS:-}
      FORGE_OIDC_GOOGLE_CLIENT_ID: ${FORGE_OIDC_GOOGLE_CLIENT_ID:-}
      FORGE_OIDC_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/oidc_google_client_secret
      FORGE_OIDC_MICROSOFT_CLIENT_ID: ${FORGE_OIDC_MICROSOFT_CLIENT_ID:-}
      FORGE_OIDC_MICROSOFT_CLIENT_SECRET_FILE: /run/secrets/oidc_microsoft_client_secret
      FORGE_OIDC_MICROSOFT_TENANT: ${FORGE_OIDC_MICROSOFT_TENANT:-organizations}
    secrets:
      - board_token
      - super_admin_password
      - oidc_google_client_secret
      - oidc_microsoft_client_secret
    volumes:
      - server-data:/data

  instance:
    build:
      context: ..
      dockerfile: docker/instance.Dockerfile
    environment:
      FORGE_MODE: hub
      FORGE_SERVER_URL: http://server:4311
      FORGE_TOKEN_PATH: /run/secrets/board_token
      FORGE_INSTANCE_TOKEN_FILE: /run/secrets/instance_token
      FORGE_PUBLIC_ORIGIN: ${FORGE_PUBLIC_INSTANCE_URL:-}
      FORGE_OIDC_ALLOWED_DOMAINS: ${FORGE_OIDC_ALLOWED_DOMAINS:-}
      FORGE_OIDC_GOOGLE_CLIENT_ID: ${FORGE_OIDC_GOOGLE_CLIENT_ID:-}
      FORGE_OIDC_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/oidc_google_client_secret
      FORGE_OIDC_MICROSOFT_CLIENT_ID: ${FORGE_OIDC_MICROSOFT_CLIENT_ID:-}
      FORGE_OIDC_MICROSOFT_CLIENT_SECRET_FILE: /run/secrets/oidc_microsoft_client_secret
      FORGE_OIDC_MICROSOFT_TENANT: ${FORGE_OIDC_MICROSOFT_TENANT:-organizations}
    secrets:
      - board_token
      - instance_token
      - oidc_google_client_secret
      - oidc_microsoft_client_secret
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - instance-data:/data
      - ${FORGE_REPOSITORIES:-./repositories}:/repositories

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    environment:
      FORGE_INSTANCE_URL: ${FORGE_PUBLIC_INSTANCE_URL:?the address browsers reach the instance at}
      FORGE_SERVER_URL: ${FORGE_PUBLIC_SERVER_URL:-}
    depends_on:
      instance:
        condition: service_healthy
    ports:
      - '4310:80'

secrets:
  board_token:
    file: ./board_token.secret
  super_admin_password:
    file: ./super_admin_password.secret
  instance_token:
    file: ./instance_token.secret
  oidc_google_client_secret:
    file: ./oidc_google_client_secret.secret
  oidc_microsoft_client_secret:
    file: ./oidc_microsoft_client_secret.secret

volumes:
  server-data:
  instance-data:
