name: forge-laptop

services:
  instance:
    build:
      context: ..
      dockerfile: docker/instance.Dockerfile
    environment:
      FORGE_MODE: local
      FORGE_TOKEN_FILE: /run/secrets/board_token
      FORGE_PUBLIC_ORIGIN: http://forge.localhost
    secrets:
      - board_token
    volumes:
      - instance-data:/data
      - ${FORGE_REPOSITORIES:-./repositories}:/repositories
    ports:
      - '4311:4311'

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    environment:
      FORGE_API_PROXY_TARGET: http://instance:4311
    depends_on:
      instance:
        condition: service_healthy
    ports:
      - '80:80'

secrets:
  board_token:
    file: ./board_token.secret

volumes:
  instance-data:
