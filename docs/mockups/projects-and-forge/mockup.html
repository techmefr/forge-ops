<title>Forge Sujets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@1,112,900&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --deep:#EEF0E6;--panel:#FFFFFF;--card:#FAFBF5;--elev:#F2F4EA;--line:#DDE0D2;
  --txthi:#15161B;--txtmid:#4E5060;--txtlow:#6C6E7C;
  --acc:#9BE000;--acc-ink:#3F5A00;--acc-bg:#EEFFC2;
  --info:#0078A8;--info-bg:#DDF4FC;--green:#0F8A47;--green-bg:#DDF7E8;
  --red:#C8163A;--red-bg:#FFE3E9;--warn:#9A5B00;--warn-bg:#FFF0D1;
  --violet:#6A3FE0;--violet-bg:#ECE5FF;
  --font-display:'Archivo',system-ui,sans-serif;--font-body:'Barlow',system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --deep:#07070A;--panel:#0C0C12;--card:#0E0E15;--elev:#16161E;--line:#1E1E27;
  --txthi:#F4F4F6;--txtmid:#A6A6B4;--txtlow:#7C7C8A;
  --acc:#D6FF2B;--acc-ink:#D6FF2B;--acc-bg:#2A3300;
  --info:#00E0FF;--info-bg:#062A33;--green:#22E67A;--green-bg:#0A2A18;
  --red:#FF7A93;--red-bg:#3A0A15;--warn:#FFB020;--warn-bg:#33240A;
  --violet:#C3AEFF;--violet-bg:#221A3D;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --deep:#07070A;--panel:#0C0C12;--card:#0E0E15;--elev:#16161E;--line:#1E1E27;
  --txthi:#F4F4F6;--txtmid:#A6A6B4;--txtlow:#7C7C8A;
  --acc:#D6FF2B;--acc-ink:#D6FF2B;--acc-bg:#2A3300;
  --info:#00E0FF;--info-bg:#062A33;--green:#22E67A;--green-bg:#0A2A18;
  --red:#FF7A93;--red-bg:#3A0A15;--warn:#FFB020;--warn-bg:#33240A;
  --violet:#C3AEFF;--violet-bg:#221A3D;
}
*{box-sizing:border-box}
body{background:var(--deep);color:var(--txthi);font-family:var(--font-body);font-size:14px}
.disp{font-family:var(--font-display);font-weight:900;font-style:italic;font-variation-settings:'wdth' 112;letter-spacing:-.01em;text-transform:uppercase}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.note{padding:10px 16px;background:var(--acc-bg);color:var(--acc-ink);font-size:13px;border-bottom:1px solid var(--line)}
header.top{display:flex;align-items:center;gap:20px;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-size:18px}
.brand span{color:var(--acc-ink)}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{padding:6px 12px;border-radius:6px;color:var(--txtmid);text-decoration:none;font-weight:600;font-size:13px}
nav.main a.on{background:var(--elev);color:var(--txthi)}
.who{margin-left:auto;font-size:13px;color:var(--txtmid)}
nav.tabs{display:flex;gap:2px;padding:0 24px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;color:var(--txtmid);cursor:pointer;font-size:13px;white-space:nowrap}
nav.tabs button.on{border-bottom-color:var(--acc);color:var(--txthi)}
nav.tabs button .new{font-family:var(--font-mono);font-style:normal;font-size:10px;margin-left:6px;padding:1px 5px;border-radius:4px;background:var(--acc-bg);color:var(--acc-ink);text-transform:none;font-weight:500}
.toolbar{display:flex;gap:10px;align-items:center;padding:14px 24px;flex-wrap:wrap}
.toolbar label{font-size:12px;color:var(--txtlow);text-transform:uppercase;letter-spacing:.06em}
.toolbar select,.toolbar input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.toolbar input{min-width:0;width:220px;max-width:100%}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;padding:0 24px 32px}
aside.people{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;align-self:start;position:sticky;top:12px}
.people h3{margin:8px 10px 6px;font-size:11px;color:var(--txtlow);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.person{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:7px;cursor:pointer;text-align:left}
.person:hover{background:var(--elev)}
.person.on{background:var(--elev);box-shadow:inset 3px 0 0 var(--acc)}
.av{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--elev);color:var(--txtmid);border:1px solid var(--line)}
.person .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.cnt{font-size:12px;color:var(--txtmid)}
.flag{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--red-bg);color:var(--red);font-weight:600}
.sep{height:1px;background:var(--line);margin:6px 4px}
.hint{font-size:12px;color:var(--txtlow);margin:10px 10px 4px}
section.list{min-width:0}
.listhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.listhead h2{margin:0;font-size:22px}
.listhead .sub{color:var(--txtmid)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--txtmid)}
.chip.on{background:var(--txthi);color:var(--panel);border-color:var(--txthi)}
.rows{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--card)}
.ttl{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sum{color:var(--txtmid);font-size:13px;margin-top:3px}
.meta{display:flex;gap:10px;margin-top:4px;font-size:12px;color:var(--txtlow);flex-wrap:wrap}
.proj{font-family:var(--font-mono);font-size:11px;padding:1px 7px;border-radius:4px;font-weight:500}
.proj,.tag{background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 78%,var(--txthi))}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;font-weight:500}
.btn-primary{background:var(--acc);color:#15161B;border:0;border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.push{margin-left:auto}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:6;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:100%;overflow:auto;padding:20px}
.modal h3{margin:0 0 14px;font-size:18px}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.form input:not([type=checkbox]):not([type=color]),.form select,.form textarea{min-width:0;width:100%}
textarea{font:inherit}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--txtlow);text-transform:uppercase;letter-spacing:.05em}
.form input,.form select,.form textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 9px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--txthi)}
.form small{text-transform:none;letter-spacing:0;color:var(--txtlow)}
.tagpick{display:flex;gap:6px;flex-wrap:wrap}
.tagpick button{border:1px solid var(--line);background:none;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:12px}
.tagpick button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.err{color:var(--red);font-size:13px;margin-top:8px}
.settings{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;padding:16px 24px 32px}
.settings nav{display:flex;flex-direction:column;gap:2px}
.settings nav button{text-align:left;background:none;border:0;padding:8px 12px;border-radius:7px;cursor:pointer;color:var(--txtmid);font-weight:500}
.settings nav button.on{background:var(--elev);color:var(--txthi);box-shadow:inset 3px 0 0 var(--acc)}
.ref{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.ref-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.ref-row:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.ref-row .grow{flex:1;min-width:140px}
.ref-row small{color:var(--txtlow)}
.ref-add{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.ref-add input[type=text]{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 9px;flex:1;min-width:140px}
.ref-add input[type=color],.ref-row input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
.pill.on{background:var(--green-bg);color:var(--green)}.pill.off{background:var(--elev);color:var(--txtlow)}
.foot{color:var(--txtlow);font-size:12px;margin:10px 2px}
.flag.late{background:var(--red);color:var(--panel)}
.drawer-bg{position:fixed;inset:0;background:rgba(10,10,14,.14);z-index:4}
.modal-bg{background:rgba(10,10,14,.42)!important}
@supports (backdrop-filter:blur(1px)){.drawer-bg{backdrop-filter:blur(3px)}.modal-bg{backdrop-filter:blur(9px)}}
@media (prefers-reduced-transparency:reduce){.drawer-bg,.modal-bg{backdrop-filter:none}}
.ev{font-size:11px;padding:1px 7px;border-radius:4px;font-weight:600;background:color-mix(in srgb,var(--c) 15%,transparent);color:color-mix(in srgb,var(--c) 80%,var(--txthi));white-space:nowrap}
.lnk{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;color:var(--txthi);text-decoration:none;background:var(--card);white-space:nowrap}
.lnk:hover{border-color:var(--acc-ink)}
.links{display:flex;gap:6px;flex-wrap:wrap}
.link-row{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:6px;margin-bottom:6px}
.newtag{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.newtag input[type=text]{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;color:var(--txthi);flex:1;min-width:140px}
.tagpick button .x{margin-left:4px;opacity:.7}
.g-ev{position:absolute;top:8px;width:14px;height:14px;transform:translateX(-7px) rotate(45deg);background:var(--c);border:2px solid var(--panel);z-index:3;cursor:help}
.g-evlbl{position:absolute;top:24px;font-size:10px;font-weight:600;color:color-mix(in srgb,var(--c) 80%,var(--txthi));white-space:nowrap;transform:translateX(-50%);z-index:3}
.g-proj{min-height:48px}
.upcoming{margin:0 24px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.upcoming h3{margin:0 0 10px;font-size:13px}
.up-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.up{flex:none;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:8px 10px;min-width:190px;background:var(--card);cursor:pointer}
.up b{display:block;font-size:13px}
.up small{color:var(--txtlow)}
.up .when{font-family:var(--font-mono);font-size:12px;color:color-mix(in srgb,var(--c) 80%,var(--txthi));font-weight:500}
.dr-sec{margin:16px 0 8px;font-size:12px;color:var(--txtlow);text-transform:uppercase;letter-spacing:.05em}
.plinks{display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%;padding-left:46px}
.plinks .lnk .x{margin-left:6px;cursor:pointer;color:var(--txtlow)}
.plink-add{display:flex;gap:6px;flex-wrap:wrap}
.plink-add select,.plink-add input{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 7px;font-size:12px;color:var(--txthi)}
.combo{position:relative;display:inline-block;min-width:200px}
.combo input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 28px 6px 10px}
.combo::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--txtlow);pointer-events:none;font-size:11px}
.combo ul{position:absolute;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:8;max-height:260px;overflow:auto;text-transform:none;letter-spacing:0}
.combo li{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--txthi);font-size:14px}
.combo li[aria-selected="true"],.combo li.active{background:var(--elev)}
.combo li .dot{width:10px;height:10px}
.combo li.create{color:var(--acc-ink);font-weight:600;border-top:1px solid var(--line);border-radius:0 0 6px 6px;margin-top:4px}
.combo li.none{color:var(--txtlow);cursor:default}
.form .combo{display:block}
.form .combo input{background:var(--card);font-size:14px;color:var(--txthi)}
@media (max-width:760px){.form{grid-template-columns:1fr}.settings{grid-template-columns:1fr;padding:16px}.settings nav{flex-direction:row;overflow-x:auto}}
.prio{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--warn-bg);color:var(--warn);font-weight:600}
.state{border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:12px;font-weight:600;cursor:pointer}
.state.todo{background:var(--elev);color:var(--txtmid)}
.state.doing{background:var(--info-bg);color:var(--info)}
.state.blocked{background:var(--warn-bg);color:var(--warn)}
.state.done{background:var(--green-bg);color:var(--green)}
.state.trash{background:var(--elev);color:var(--txtlow)}
.due{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--elev);color:var(--txtmid);min-width:62px;text-align:center}
.due.late{background:var(--red-bg);color:var(--red)}
.due.soon{background:var(--warn-bg);color:var(--warn)}
.take{border:1px solid var(--red);color:var(--red);background:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:600;font-size:12px;white-space:nowrap}
.release{border:1px solid var(--line);background:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;color:var(--txtmid);white-space:nowrap}
.group{padding:10px 16px;background:var(--elev);font-size:12px;font-weight:600;color:var(--txtmid);display:flex;gap:8px;align-items:center;border-top:1px solid var(--line)}
.group:first-child{border-top:0}
.empty{padding:28px 16px;color:var(--txtmid);text-align:center}
.bar{height:4px;border-radius:2px;background:var(--elev);width:70px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--green)}
.drawer{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.18);padding:20px;overflow:auto;z-index:5}
.drawer h3{margin:4px 0 12px;font-size:18px}
.drawer dl{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;margin:0 0 16px}
.drawer dt{color:var(--txtlow);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.drawer dd{margin:0}
.drawer .close{float:right;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.drawer textarea{width:100%;min-height:70px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;color:inherit}
.placeholder{margin:24px;padding:40px;border:1px dashed var(--line);border-radius:10px;color:var(--txtmid);text-align:center;background:var(--panel)}
.gantt-wrap{margin:0 24px 32px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.gantt{min-width:860px}
.g-row{display:grid;grid-template-columns:240px 1fr;border-top:1px solid var(--line);min-height:44px}
.g-row.head{border-top:0;font-size:12px;color:var(--txtlow)}
.g-lbl{padding:8px 14px;display:flex;flex-direction:column;justify-content:center}
.g-lbl small{color:var(--txtlow);font-family:var(--font-mono);font-size:11px}
.g-track{position:relative;border-left:1px solid var(--line)}
.g-bar{position:absolute;top:11px;height:22px;border-radius:5px;font-size:11px;padding:3px 8px;white-space:nowrap;overflow:hidden;font-weight:600}
.g-bar.doing{background:var(--info-bg);color:var(--info)}
.g-bar.blocked{background:var(--warn-bg);color:var(--warn)}
.g-bar.done{background:var(--green-bg);color:var(--green)}
.g-bar.todo{background:var(--elev);color:var(--txtmid)}
.g-out{position:absolute;top:14px;font-size:11px;font-weight:600;white-space:nowrap;color:var(--txtmid);z-index:2}
.g-out.late{color:var(--red)}
.g-late{position:absolute;top:11px;height:22px;border-radius:0 5px 5px 0;background:repeating-linear-gradient(45deg,var(--red-bg) 0 5px,transparent 5px 9px);border:1px dashed var(--red);border-left:0}
.g-proj{background:color-mix(in srgb,var(--c) 10%,transparent);min-height:36px}
.g-proj .dot{background:var(--c)}
.g-proj small{color:var(--txtlow);font-family:var(--font-body)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--txthi);z-index:1}
.g-tick{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line);font-size:11px;padding:12px 0 0 4px;color:var(--txtlow)}
.nodate{margin:0 24px 32px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nodate span{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 8px;font-size:12px}
@media (max-width:760px){
  header.top,.toolbar,nav.tabs{padding-left:16px;padding-right:16px}
  .layout{grid-template-columns:1fr;padding:0 16px 24px}
  aside.people{position:static;display:flex;overflow-x:auto;gap:4px}
  aside.people h3,aside.people .sep,aside.people .hint{display:none}
  .person{flex:none;width:auto}
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row .due{grid-column:2}
  .gantt-wrap,.nodate{margin-left:16px;margin-right:16px}
}
.wx-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:0 24px 14px}
.wx{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--w);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.wx:hover{background:var(--card)}
.wx[data-w=sun]{--w:var(--green)}.wx[data-w=cloud]{--w:var(--warn)}.wx[data-w=storm]{--w:var(--red)}
.wx .hd{display:flex;align-items:center;gap:8px}
.wx .sky{margin-left:auto;font-size:13px;font-weight:600;color:var(--w);display:flex;align-items:center;gap:5px}
.wx .sky b{font-size:20px;line-height:1}
.wx .st{font-size:13px;color:var(--txtmid)}
body{margin:0}
[hidden]{display:none!important}
.pcard{cursor:pointer}
.res{display:flex;gap:8px 18px;align-items:center;flex-wrap:wrap;padding:10px 24px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--txtmid)}
.res-i{display:flex;gap:6px;align-items:center;white-space:nowrap}
.res-i b{color:var(--txthi)}
.gauge{width:56px;height:6px;border-radius:3px;background:var(--elev);overflow:hidden;display:inline-block}
.gauge i{display:block;height:100%;background:var(--green)}
.res-i.warm .gauge i{background:var(--warn)}.res-i.hot .gauge i{background:var(--red)}.res-i.hot{color:var(--red)}
.res-ok{color:var(--green);font-weight:600}
.res-more{margin-left:auto;padding:3px 10px;font-size:12px}
@media (max-width:760px){.res{padding:10px 16px}.res-more{margin-left:0}}

function roadmap(){
  const from=new Date(2026,7,1),to=new Date(2026,10,1),span=to-from;

  let h=`<div class="g-row head"><div class="g-lbl">Sujet · responsable</div><div class="g-track">${ticks}${today}</div></div>`;
  const bar=(s)=>{const st=s.start||s.due;const l=pos(st),w=Math.max(1.2,pos(s.due)-l+1.1);
    const late=isLate(s);const lateW=late?Math.max(0,pos(TODAY)-(l+w)):0;
    const label=`${esc(s.t)} · ${fmt(s.due)}${late?` · J+${-dayDiff(s.due)}`:''}`;
    const inside=w>=14;const endPct=l+w+lateW;const flip=endPct>78;
    const lbl=inside?'':`<span class="g-out${late?' late':''}" style="${flip?`right:${100-l+0.6}%`:`left:${endPct+0.6}%`}">${label}</span>`;
    return `<span class="g-bar ${s.st}" style="left:${l}%;width:${w}%" title="${label}">${inside?label:''}</span>${late?`<span class="g-late" style="left:${l+w}%;width:${lateW}%" title="En retard"></span>`:''}${lbl}`};
  const row=(s)=>`<div class="g-row" data-open="${s.id}" style="cursor:pointer"><div class="g-lbl"><strong>${esc(s.t)}${isLate(s)?' <span class="flag late">retard</span>':''}</strong><small>${s.o?esc(name(s.o).split(' ')[0]):'Personne'} · ${fmt(s.start)} → ${fmt(s.due)}</small></div><div class="g-track">${today}${bar(s)}${evs.filter(e=>e.sid===s.id).map(marker).join('')}</div></div>`;

  const marker=(e)=>`<span class="g-ev" style="left:${pos(e.d)}%;--c:${EV_TYPES[e.type].c}" title="${esc(EV_TYPES[e.type].l+' · '+fmt(e.d)+' · '+e.t)}"></span>`;
  const projs=PROJECTS.filter(p=>dated.some(s=>s.p===p.n)||evs.some(e=>e.p===p.n));
  projs.forEach(p=>{const g=dated.filter(s=>s.p===p.n);const lt=g.filter(isLate).length;const pe=evs.filter(e=>e.p===p.n).sort((a,b)=>a.d-b.d);
    const lastAt=[];const lane=new Map(pe.map(e=>{const x=pos(e.d);let r=0;while(lastAt[r]!==undefined&&x-lastAt[r]<9)r++;lastAt[r]=x;return [e.id,r]}));
    h+=`<div class="g-row g-proj" style="--c:${p.c}"><div class="g-lbl"><span style="display:flex;gap:8px;align-items:center"><span class="dot"></span><strong class="disp">${esc(p.n)}</strong><small>${g.length} sujet${g.length>1?'s':''}${lt?` · ${lt} en retard`:''}</small></span>${p.links.length?`<span class="links" style="margin-top:4px">${linkChips(p.links)}</span>`:''}</div><div class="g-track" style="min-height:${40+Math.max(0,lastAt.length-1)*14}px">${today}${pe.map(e=>marker(e)+`<span class="g-evlbl" style="left:${pos(e.d)}%;top:${24+lane.get(e.id)*14}px;--c:${EV_TYPES[e.type].c}">${esc(EV_TYPES[e.type].l)}</span>`).join('')}</div></div>`+g.map(row).join('')});
  const nodate=subjects.filter(s=>inProject(s)&&matches(s)&&!s.due&&!['trash','done'].includes(s.st));
  const up=evs.filter(e=>dayDiff(e.d)>=0).sort((a,b)=>a.d-b.d);

  if(dd){readDraft();state.draft.deps=state.draft.deps.filter(x=>x!==Number(dd.dataset.ddel));subjectForm();return}
  const ld=e.target.closest('[data-ldel]');
  if(ld){readDraft();state.draft.links.splice(+ld.dataset.ldel,1);subjectForm();return}
  if(e.target.id==='mf-cancel'||e.target.id==='modal-bg'){state.modal=false;subjectForm()}
});
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-main]');
  if(m){e.preventDefault();state.main=m.dataset.main;state.open=null;state.openProject=null;state.openCols=null;state.openCard=null;return render()}
  if(e.target.id==='res-open'){state.openRes=true;return render()}
  if(e.target.id==='cfg-open'){state.cfgProj=state.pProj;state.openCols=true;return render()}
  const pp=e.target.closest('[data-pproj]');
  if(pp){state.pProj=pp.dataset.pproj;state.pSubj='all';return render()}
  const pv=e.target.closest('[data-pview]');
  if(pv){state.pView=pv.dataset.pview;try{localStorage.setItem('forge.pView',state.pView)}catch(_){}return render()}
  const wfp=e.target.closest('[data-wfproj]');
  if(wfp){state.cfgProj=wfp.dataset.wfproj;state.openCols=true;return render()}
  const cfgb=e.target.closest('[data-colcfg]');
  if(cfgb){state.cfgProj=state.pProj;state.openCols=Number(cfgb.dataset.colcfg);return render()}
  const pk=(attr)=>{const b=e.target.closest(`[${attr}]`);return b?PCARDS.find(k=>k.id===Number(b.getAttribute(attr).split(':')[0])):null};
  let card;
  if((card=pk('data-launch'))){const fc=colsOf(projOfCard(card))[0];if(fc)moveCard(card,fc.id);return render()}
  if((card=pk('data-next'))){const o=colOrder(projOfCard(card));moveCard(card,o[o.indexOf(card.col)+1]);return render()}
  if((card=pk('data-relaunch'))){moveCard(card,card.col);return render()}
  if((card=pk('data-mv'))){const dir=Number(e.target.closest('[data-mv]').dataset.mv.split(':')[1]);const o=colOrder(projOfCard(card));const to=o[o.indexOf(card.col)+dir];if(to!==undefined)moveCard(card,to);return render()}
  if(e.target.id==='cfg-add'){colsOf(state.cfgProj).push({id:++colId,n:'Nouvelle étape',c:'#6C7A89',...cfgOf('Claude Code','claude-sonnet-5','medium','Aucun · session principale','','',true)});state.openCols=colId;render();document.querySelector(`[data-cn="${colId}"]`)?.select();return}
  const cm=e.target.closest('[data-cmv]');
  if(cm&&!cm.disabled){const [cid,dir]=cm.dataset.cmv.split(':').map(Number);const L=colsOf(state.cfgProj);const i=L.findIndex(c=>c.id===cid);const j=i+dir;[L[i],L[j]]=[L[j],L[i]];state.openCols=cid;return render()}
  const cdl=e.target.closest('[data-cdel]');
  if(cdl&&!cdl.disabled){{const L=colsOf(state.cfgProj);L.splice(L.findIndex(c=>c.id===Number(cdl.dataset.cdel)),1)};state.openCols=true;return render()}
  if((card=pk('data-stop'))){card.run=null;card.msgs.push(sys('Session arrêtée'));return render()}
  const pcd=e.target.closest('.pcard,.pipe-row[data-card]');
  if(pcd&&!e.target.closest('button')){state.openCard=Number(pcd.dataset.card);state.cdDraft='';return render()}
  if(e.target.id==='new-subject'){return openForm()}
  if(e.target.id==='new-event'){return openEvent()}
  if(e.target.id==='dr-edit'){return openForm(subjects.find(x=>x.id===state.open))}
  if(e.target.id==='dr-event'){return openEvent(subjects.find(x=>x.id===state.open))}
  if(e.target.id==='drawer-bg'){state.openRes=false;state.open=null;state.openProject=null;state.openCols=null;state.openCard=null;return render()}
  if(e.target.id==='dr-pevent'){const p=state.openProject;openEvent(null);state.ev.p=p;return eventModal()}
  const evb=e.target.closest('[data-ev]');
  if(evb){return openEvent(null,EVENTS.find(x=>x.id===Number(evb.dataset.ev)))}
  const po=e.target.closest('[data-popen]');
  if(po){state.openProject=po.dataset.popen;state.open=null;return render()}
  const rt=e.target.closest('[data-rtoggle]');
  if(rt){const r=RISKS.find(x=>x.id===Number(rt.dataset.rtoggle));r.open=!r.open;return render()}
  const pl=e.target.closest('[data-pldel]');
  if(pl){const [i,j]=pl.dataset.pldel.split('-').map(Number);PROJECTS[i].links.splice(j,1);return render()}
  if(e.target.closest('a.lnk'))return;
  const st=e.target.closest('[data-set],[data-pdel],[data-pup],[data-tdel],[data-tfilter],[data-utoggle]');
  if(st&&!st.disabled){const dd=st.dataset;
    if(dd.set)state.setTab=dd.set;
    else if(dd.pdel)PROJECTS.splice(+dd.pdel,1);
    else if(dd.pup){const i=+dd.pup;[PROJECTS[i-1],PROJECTS[i]]=[PROJECTS[i],PROJECTS[i-1]]}
    else if(dd.tdel)TAGS.splice(+dd.tdel,1);
    else if(dd.tfilter){state.tag=dd.tfilter;state.main='projects';state.tab='subjects';state.sel='ALL';state.filter='active'}
    else if(dd.utoggle){const u=USERS[+dd.utoggle];u.active=!u.active;if(!u.active&&state.sel===u.k)state.sel='ALL'}
    return render()}
  const t=e.target.closest('[data-tab],[data-sel],[data-filter],[data-take],[data-release],[data-open],#dr-close');
  if(!t||e.target.closest('select'))return;
  if(t.id==='dr-close'&&state.openRes){state.openRes=false;return render()}
  if(t.id==='dr-close'){if(state.openCols)state.openCols=null;else if(state.openCard)state.openCard=null;else if(state.open)state.open=null;else state.openProject=null;return render()}
  if(t.dataset.tab){state.tab=t.dataset.tab;state.open=null;state.openProject=null}
  else if(t.dataset.sel){state.sel=t.dataset.sel}
  else if(t.dataset.filter){state.filter=t.dataset.filter}
  else if(t.dataset.take){const s=subjects.find(x=>x.id==t.dataset.take);s.o=MY;setSt(s,'doing');s.start=TODAY;state.sel=MY}
  else if(t.dataset.release){const s=subjects.find(x=>x.id==t.dataset.release);s.o=null;setSt(s,'todo')}
  else if(t.dataset.open){state.open=Number(t.dataset.open)}
  render();
});
document.addEventListener('change',e=>{
  if(e.target.dataset.state){setSt(subjects.find(x=>x.id==e.target.dataset.state),e.target.value);render()}
  if(e.target.matches?.('[data-padmin]')){PROJECTS[+e.target.dataset.padmin].admin=e.target.value;return render()}
  if(e.target.id==='p-subj'){state.pSubj=e.target.value;return render()}
  const ds=e.target.dataset;const pc=(k)=>allCols().find(c=>c.id===Number(ds[k]));
  if(ds.cc){pc('cc').c=e.target.value;refreshBoard();e.target.closest('.cfg').style.setProperty('--c',e.target.value)}
  if(ds.cn){pc('cn').n=e.target.value.trim()||'Sans nom';refreshBoard()}
  if(ds.ca){const c=pc('ca');c.agent=e.target.value;if(c.agent==='Humain')c.auto=false;else{c.model=MODELS[c.agent][0];c.effort=c.effort||'medium';c.auto=true;if(c.agent==='Codex'){c.sub='';c.skill=c.skill||'codex exec'}else c.sub=c.sub||SUBAGENTS[0]}state.openCols=c.id;return render()}
  if(ds.cm){pc('cm').model=e.target.value;refreshBoard()}
  if(ds.ce){pc('ce').effort=e.target.value;refreshBoard()}
  if(ds.csub){pc('csub').sub=e.target.value}
  if(ds.ctpl!==undefined&&e.target.matches('[data-ctpl]')){const c=pc('ctpl');c.tpl=e.target.value;if(c.tpl)c.pre=PROMPTS[c.tpl].t;state.openCols=c.id;return render()}
  if(ds.cauto){pc('cauto').auto=e.target.checked;refreshBoard()}
  if(e.target.id==='pw-sel'){PROJECTS.find(p=>p.n===state.openProject).w=e.target.value||null;render()}
  if(e.target.dataset.ucap){USERS[+e.target.dataset.ucap].cap=Math.max(1,Number(e.target.value)||1);render()}
  if(e.target.id==='f-tag'){state.tag=e.target.value;render()}
  if(e.target.dataset.pcolor){PROJECTS[+e.target.dataset.pcolor].c=e.target.value;render()}
  if(e.target.dataset.tcolor){TAGS[+e.target.dataset.tcolor].c=e.target.value;render()}
});
document.addEventListener('input',e=>{const ds=e.target.dataset;if(ds.cs)allCols().find(c=>c.id===Number(ds.cs)).skill=e.target.value;if(ds.cp)allCols().find(c=>c.id===Number(ds.cp)).pre=e.target.value});
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-card]');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.card);e.dataTransfer.effectAllowed='move';c.classList.add('dragging')});
document.addEventListener('dragend',e=>{e.target.closest?.('[data-card]')?.classList.remove('dragging');document.querySelectorAll('.pcol-list.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('dragover',e=>{const l=e.target.closest?.('[data-drop]');if(!l)return;e.preventDefault();document.querySelectorAll('.pcol-list.over').forEach(x=>x!==l&&x.classList.remove('over'));l.classList.add('over')});
document.addEventListener('drop',e=>{const l=e.target.closest?.('[data-drop]');if(!l)return;e.preventDefault();const card=PCARDS.find(k=>k.id===Number(e.dataTransfer.getData('text/plain')));if(!card)return;
  const to=l.dataset.drop==='backlog'||l.dataset.drop==='done'?l.dataset.drop:Number(l.dataset.drop);if(card.col!==to)moveCard(card,to);render()});
document.addEventListener('input',e=>{if(e.target.id==='f-q'){state.q=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById('f-q');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&state.newProject){state.newProject=null;return projectModal()}
  if(e.key==='Escape'&&state.ev){state.ev=null;return eventModal()}
  if(e.key==='Enter'&&e.target.id==='mf-newtag'){e.preventDefault();document.getElementById('mf-addtag').click();return}
  if(e.key==='Escape'&&state.modal){state.modal=false;return subjectForm()}
  if(e.key==='Escape'&&state.openRes){state.openRes=false;return render()}
  if(e.key==='Escape'&&state.openCols){state.openCols=null;return render()}
  if(e.key==='Escape'&&state.openCard){state.openCard=null;return render()}
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='cd-msg'){e.preventDefault();e.target.form.requestSubmit();return}
  if(e.key==='Escape'&&state.open){state.open=null;return render()}
  if(e.key==='Escape'&&state.openProject){state.openProject=null;return render()}
  if(e.key==='Enter'&&e.target.dataset?.open){state.open=Number(e.target.dataset.open);return render()}
  if(state.main!=='projects'||state.tab!=='subjects'||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
  const order=['ALL','LATE','NONE',...activeUsers().map(u=>u.k)];const i=order.indexOf(state.sel);
  state.sel=order[(i+(e.key==='ArrowDown'?1:-1)+order.length)%order.length];e.preventDefault();render();
  document.querySelector('.person.on')?.focus();
});
render();
</script>
